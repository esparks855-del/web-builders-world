<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Web Builders World</title><style>
html,body{margin:0;height:100%;background:#0d1117;overflow:hidden}canvas{display:block}
#hint{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#7b8494;font-family:monospace;font-size:13px;letter-spacing:2px;z-index:2}
</style></head><body><div id="hint">WEB BUILDERS WORLD · arrows / WASD · space to jump · collect &lt;/&gt; tags · reach SHIP IT</div>
<canvas id="c"></canvas><script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
// ---- physics: max jump height ~144px, max jump range ~187px ----
// ---- level rules: step-up <= 115px, gaps <= 140px ----------------
const G=1.0, JUMP=-17, MOVE=5.5, COYOTE=6, BUFFER=6, MAXFALL=15;
let FLOOR=innerHeight-90;
// levels defined as offsets from the floor so the world can rebuild on resize
const PLAT_DEF=[[-120,0,970,90],[980,0,520,90],[1640,0,560,90],[2340,0,620,90],
[300,-110,170,26],[560,-220,170,26],[1000,-110,150,26],[1270,-220,160,26],
[1730,-110,160,26],[1970,-220,160,26],[2190,-320,140,26],[2400,-110,150,26]];
const TAG_DEF=[[385,-185],[645,-295],[1075,-185],[1350,-295],[700,-45],[1830,-45],[2050,-295],[2475,-185]];
let plats=[],tags=[],goal={x:2850,y:FLOOR};
function layout(){
if(innerWidth<10||innerHeight<10)return false; // iframe not sized yet
cv.width=innerWidth;cv.height=innerHeight;
FLOOR=innerHeight-90;
plats=PLAT_DEF.map(d=>({x:d[0],y:FLOOR+d[1],w:d[2],h:d[3]}));
if(tags.length===0)tags=TAG_DEF.map(d=>({x:d[0],y:FLOOR+d[1],dy:d[1],got:false}));
else tags.forEach((t,i)=>t.y=FLOOR+TAG_DEF[i][1]);
goal.y=FLOOR;
if(p.y>FLOOR-p.h)p.y=FLOOR-p.h;
return true;}
function layoutUntilReady(){if(!layout()){setTimeout(layoutUntilReady,120);requestAnimationFrame(layoutUntilReady);}}
addEventListener('resize',()=>layout());
layoutUntilReady();
let p={x:60,y:FLOOR-44,w:34,h:44,vx:0,vy:0,ground:false,coyote:0,buffer:0,face:1,sq:1,sy:1};
let cam=0,score=0,won=false,t=0,dust=[],spark=[];
const glyphs=[];for(let i=0;i<26;i++)glyphs.push({x:Math.random()*3400,y:Math.random()*innerHeight,
s:['{','}','<','>',';','/'][i%6],s2:['=','+','#','!'][i%4],v:.3+Math.random()*.7});
// ---- sound effects generated in code (no audio files) ----
let AC=null;
function beep(f,d=.07,type='square',g=.05,slide=0){
try{AC=AC||new AudioContext();const o=AC.createOscillator(),v=AC.createGain();
o.type=type;o.frequency.setValueAtTime(f,AC.currentTime);
if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+d);
v.gain.setValueAtTime(g,AC.currentTime);v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
o.connect(v);v.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sfx={
jump:()=>beep(300,.12,'square',.04,600),
land:()=>beep(140,.05,'triangle',.05),
tag:()=>{beep(700,.08,'square',.05);setTimeout(()=>beep(1050,.1,'square',.05),70);},
win:()=>{[440,554,659,880].forEach((f,i)=>setTimeout(()=>beep(f,.18,'square',.05),i*130));}};
// ---- input abstraction ----
const keys={left:false,right:false,jumpHeld:false};
const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',' ':'jump',ArrowUp:'jump',w:'jump'};
addEventListener('keydown',e=>{const k=map[e.key];if(!k)return;e.preventDefault();
if(k==='jump'){if(!keys.jumpHeld)p.buffer=BUFFER;keys.jumpHeld=true;}else keys[k]=true;});
addEventListener('keyup',e=>{const k=map[e.key];if(!k)return;
if(k==='jump')keys.jumpHeld=false;else keys[k]=false;});
function loop(){t++;
if(keys.right){p.vx=MOVE;p.face=1;}else if(keys.left){p.vx=-MOVE;p.face=-1;}else p.vx*=.72;
if(p.ground)p.coyote=COYOTE;else if(p.coyote>0)p.coyote--;
if(p.buffer>0)p.buffer--;
if(p.buffer>0&&p.coyote>0){p.vy=JUMP;p.coyote=0;p.buffer=0;p.ground=false;p.sq=.7;p.sy=1.35;sfx.jump();
for(let i=0;i<6;i++)dust.push({x:p.x+p.w/2,y:p.y+p.h,vx:(Math.random()-.5)*3,vy:Math.random()*1.5,l:20});}
if(!keys.jumpHeld&&p.vy<-6)p.vy=-6;
p.vy=Math.min(p.vy+G,MAXFALL);
const oldY=p.y;p.x+=p.vx;p.y+=p.vy;
p.ground=false;
for(const pl of plats){
if(p.x+p.w>pl.x&&p.x<pl.x+pl.w){
if(oldY+p.h<=pl.y+2&&p.y+p.h>=pl.y&&p.vy>=0){
if(p.vy>6){p.sq=1.35;p.sy=.7;sfx.land();
for(let i=0;i<8;i++)dust.push({x:p.x+p.w/2,y:pl.y,vx:(Math.random()-.5)*4,vy:-Math.random()*2,l:22});}
p.y=pl.y-p.h;p.vy=0;p.ground=true;}
else if(oldY>=pl.y+pl.h-2&&p.y<=pl.y+pl.h&&p.vy<0){p.y=pl.y+pl.h;p.vy=0;}}}
p.sq+=(1-p.sq)*.18;p.sy+=(1-p.sy)*.18;
if(p.y>innerHeight+240){p.x=60;p.y=FLOOR-44;p.vx=0;p.vy=0;}
for(const tg of tags){if(!tg.got&&Math.hypot(p.x+p.w/2-tg.x,p.y+p.h/2-tg.y)<36){tg.got=true;score++;sfx.tag();
for(let i=0;i<12;i++)spark.push({x:tg.x,y:tg.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,l:26});}}
if(!won&&Math.abs(p.x-goal.x)<60&&p.y+p.h>FLOOR-80){won=true;sfx.win();}
cam+=((p.x+p.face*90-innerWidth*.42)-cam)*.08;
// ---- draw ----
x.fillStyle='#0d1117';x.fillRect(0,0,innerWidth,innerHeight);
x.font='16px monospace';
for(const g of glyphs){g.y+=g.v;if(g.y>innerHeight)g.y=-20;
x.fillStyle='rgba(90,140,255,.13)';x.fillText(g.s,g.x-cam*.25,g.y);
x.fillStyle='rgba(139,92,246,.09)';x.fillText(g.s2,g.x*1.4-cam*.5,(g.y*1.3)%innerHeight);}
for(const pl of plats){
x.fillStyle='#161b22';x.fillRect(pl.x-cam,pl.y,pl.w,pl.h);
x.fillStyle='#30363d';x.fillRect(pl.x-cam,pl.y,pl.w,4);
x.strokeStyle='rgba(63,185,80,.22)';x.lineWidth=1;
for(let lx=pl.x+14;lx<pl.x+pl.w;lx+=34){x.beginPath();x.moveTo(lx-cam,pl.y+4);x.lineTo(lx-cam,pl.y+pl.h);x.stroke();}
x.fillStyle='rgba(63,185,80,.5)';x.font='11px monospace';x.fillText('div { }',pl.x-cam+8,pl.y+18);}
for(const tg of tags){if(tg.got)continue;const bob=Math.sin(t/14+tg.x)*5;
x.shadowBlur=16;x.shadowColor='#ffd23f';x.fillStyle='#ffd23f';x.font='bold 24px monospace';
x.fillText('</>',tg.x-20-cam,tg.y+bob+8);x.shadowBlur=0;}
x.shadowBlur=25;x.shadowColor='#3fb950';x.fillStyle='#3fb950';x.font='bold 16px monospace';
x.fillText('SHIP IT',goal.x-30-cam,goal.y-95);
x.beginPath();x.moveTo(goal.x-cam,goal.y-80);x.lineTo(goal.x-16-cam,goal.y-40);x.lineTo(goal.x+16-cam,goal.y-40);x.closePath();x.fill();
if(t%9<5){x.fillStyle='#ff8a00';x.beginPath();x.moveTo(goal.x-cam,goal.y-38);x.lineTo(goal.x-8-cam,goal.y-22);x.lineTo(goal.x+8-cam,goal.y-22);x.closePath();x.fill();}
x.shadowBlur=0;
const px=p.x-cam,cy=p.y,sw=p.w*p.sq,sh=p.h*p.sy,ox=px-(sw-p.w)/2;
x.save();x.translate(px+p.w/2,cy+p.h);x.scale(p.sq,p.sy);x.translate(-(px+p.w/2),-(cy+p.h));
x.shadowBlur=20;x.shadowColor='#00c8ff';
x.fillStyle='#e9eef5';x.fillRect(ox,cy+p.h-sh,sw,10*(sh/p.h));
x.fillStyle='#ff5f57';x.beginPath();x.arc(ox+7,cy+p.h-sh+5,3,0,6.28);x.fill();
x.fillStyle='#febc2e';x.beginPath();x.arc(ox+15,cy+p.h-sh+5,3,0,6.28);x.fill();
x.fillStyle='#28c840';x.beginPath();x.arc(ox+23,cy+p.h-sh+5,3,0,6.28);x.fill();
x.fillStyle='#c8d3e0';x.fillRect(ox,cy+p.h-sh+10*(sh/p.h),sw,sh-10*(sh/p.h));
x.fillStyle='#0d1117';x.font='bold 14px monospace';x.fillText('</>',ox+7,cy+p.h-sh+32*(sh/p.h));
x.shadowBlur=0;x.restore();
dust=dust.filter(d=>d.l>0);for(const d of dust){d.x+=d.vx;d.y+=d.vy;d.l--;
x.globalAlpha=d.l/22;x.fillStyle='#8b949e';x.fillRect(d.x-cam,d.y,3,3);}x.globalAlpha=1;
spark=spark.filter(s=>s.l>0);for(const s of spark){s.x+=s.vx;s.y+=s.vy;s.l--;
x.globalAlpha=s.l/26;x.fillStyle='#ffd23f';x.fillRect(s.x-cam,s.y,4,4);}x.globalAlpha=1;
x.fillStyle='#ffd23f';x.font='bold 20px monospace';x.fillText('TAGS '+score+'/'+tags.length,20,36);
if(won){x.fillStyle='#3fb950';x.font='bold 50px monospace';x.textAlign='center';
x.shadowBlur=30;x.shadowColor='#3fb950';x.fillText('SHIPPED!',innerWidth/2,innerHeight/2);x.shadowBlur=0;
x.font='15px monospace';x.fillStyle='#aaa';x.fillText('site deployed · '+score+' tags collected',innerWidth/2,innerHeight/2+34);x.textAlign='left';}
requestAnimationFrame(loop);}loop();
</script></body></html>
